---
# ============================================================
# common: OS updates, deploy user, SSH hardening, fail2ban
# ============================================================

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600 # skip if cache fresher than 1h (idempotency/speed)

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - vim
      - htop
      - fail2ban
      - unattended-upgrades
      - apt-transport-https
      - ca-certificates
    state: present

# --- Hetzner private network ------------------------------------------------
# Sometimes the private NIC appears just after cloud-init writes its network
# config, so 50-cloud-init.yaml has no stanza for it and the link stays DOWN
# forever — nodes then can't reach the API server on the private network.
# Only acts on a node that actually has the interface unconfigured, so healthy
# nodes are untouched (no netplan apply, no network blip).

- name: Configure Hetzner private network interface (if left unconfigured)
  when:
    - "'enp7s0' in ansible_interfaces"
    - ansible_facts['enp7s0']['ipv4'] is not defined
  block:
    - name: Write netplan config for private interface
      ansible.builtin.copy:
        dest: /etc/netplan/60-hetzner-private.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              enp7s0:
                dhcp4: true

    - name: Apply netplan
      ansible.builtin.command: netplan apply

    - name: Wait for the private address to appear
      ansible.builtin.command: ip -4 addr show enp7s0
      register: priv_addr
      retries: 10
      delay: 3
      until: "'inet ' in priv_addr.stdout"
      changed_when: false

    - name: Re-gather facts so later plays see the new address
      ansible.builtin.setup:

# --- deploy user -------------------------------------------------------------

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Install SSH public key for deploy user
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_public_key }}"
    state: present

# Passwordless sudo — required for Ansible 'become' to work non-interactively
# (the deploy user has no password at all; auth is SSH-key only).
- name: Allow deploy user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ deploy_user }}
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

# --- SSH hardening -----------------------------------------------------------

# Drop-in overrides /etc/ssh/sshd_config defaults (Ubuntu reads
# sshd_config.d/*.conf first-match-wins, so 99- prefix + explicit values win).
- name: Harden sshd (no root login, no passwords)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/common). Do not edit on the server.
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      X11Forwarding no
      AllowUsers {{ deploy_user }}
    validate: sshd -t -f %s
  notify: Restart sshd

# --- fail2ban: bans IPs that brute-force SSH ---------------------------------

- name: Configure fail2ban for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

# --- Automatic security updates ----------------------------------------------

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
