# Let's Encrypt issuer, cluster-wide (any namespace's Ingress can use it).
# HTTP-01 challenge: cert-manager briefly serves a proof file through the
# nginx ingress at /.well-known/acme-challenge/ — the same mechanism certbot
# used on the old VPS, now fully automated including renewals.
#
# NOTE: DNS must already point at this cluster for issuance to succeed —
# apply this and the tls: blocks only at cutover (docs/05, step 7).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: caseythecoder90@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
