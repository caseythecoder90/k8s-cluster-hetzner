apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: backend
          image: ghcr.io/caseythecoder90/personal-website-backend:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: personal-website-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Same endpoint the compose healthcheck used
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            # generous: JVM + Flyway migrations need time on cold start
            initialDelaySeconds: 60
            periodSeconds: 30
