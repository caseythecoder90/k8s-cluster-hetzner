apiVersion: apps/v1
kind: Deployment
metadata:
  name: grindtrack
  labels:
    app: grindtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grindtrack
  template:
    metadata:
      labels:
        app: grindtrack
    spec:
      containers:
        - name: app
          # Single image: Spring Boot serving its own built-in React SPA
          image: ghcr.io/caseythecoder90/grindtrack:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # POSTGRES_DB must be defined BEFORE the URL: $(VAR) expansion
            # only sees env vars declared earlier in this list.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: POSTGRES_DB
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: JWT_SECRET
            - name: GRINDTRACK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: GRINDTRACK_USERNAME
            - name: GRINDTRACK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: GRINDTRACK_PASSWORD
            # The assistant. Unlike every other secret here, a missing value is not a broken
            # deployment: the app treats a blank key as "the AI features are switched off", the
            # endpoints answer 503 with a sentence, and everything else works. So this reference
            # can exist before the key does — but note the key must be IN the Secret before the
            # pod starts, because env vars are resolved once at container start.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: ANTHROPIC_API_KEY
                  # Without this the pod will not start until the key exists.
                  optional: true
            # Web Push. The VAPID pair identifies the app to the push services; without it push is
            # off in the same quiet way the assistant is without its key. Both halves are made
            # once with the one-liner in grindtrack's docs/push-notifications.md and patched into
            # the secret; rotating them invalidates every phone's subscription.
            - name: PUSH_VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: PUSH_VAPID_PUBLIC_KEY
                  optional: true
            - name: PUSH_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: PUSH_VAPID_PRIVATE_KEY
                  optional: true
            - name: PUSH_VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: PUSH_VAPID_SUBJECT
                  optional: true
            # Speech to text in the ask box: the relay's key for the transcription model. Optional
            # like the others; without it the mic button is not rendered.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: grindtrack-secrets
                  key: OPENAI_API_KEY
                  optional: true
            # Behind TLS at the ingress, same as behind the old edge proxy
            - name: COOKIE_SECURE
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -Xms64m"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Same endpoint the compose healthcheck used
          readinessProbe:
            httpGet:
              path: /api/public/stats
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/stats
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
