# Replaces edge-proxy track.conf: track.caseyrquinn.com -> grindtrack:8080
#
# Note on the rate limiter: the old track.conf deliberately OVERWROTE
# X-Forwarded-For with the real client IP so clients can't spoof an earlier
# hop. ingress-nginx's default behavior is the same (XFF = client IP as seen
# by nginx) — do not enable compute-full-forwarded-for, it would trust
# client-supplied XFF and reopen that hole.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grindtrack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # The assistant answers over server-sent events, which a buffering proxy would collect and
    # deliver in one piece at the end — the stream would appear to work and simply never stream.
    # ingress-nginx already defaults proxy-buffering to off; this says so out loud so a future
    # ConfigMap change cannot turn it back on underneath us. The app also sends
    # X-Accel-Buffering: no on that response, so neither half is load-bearing alone.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # A turn may take minutes if the model reads a lot. The default 60s would cut the connection
    # mid-answer; the app's own emitter gives up at 300s, so match it rather than exceed it.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - track.caseyrquinn.com
      secretName: track-caseyrquinn-com-tls
  rules:
    - host: track.caseyrquinn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grindtrack
                port:
                  name: http
