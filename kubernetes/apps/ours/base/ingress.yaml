# ours.caseylovesyas.com. One host so the session cookie stays same-origin:
#   /api, /ws, /oauth2, /login, /logout -> api (Spring Security owns those)
#   everything else                      -> frontend (nginx, SPA fallback)
#
# Uploads bypass the api (presigned to R2 from milestone 2), so 2m is plenty.
# The WebSocket timeouts matter from milestone 4; harmless before.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ours
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ours.caseylovesyas.com
      secretName: ours-caseylovesyas-com-tls
  rules:
    - host: ours.caseylovesyas.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /logout
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
